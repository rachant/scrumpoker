<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrum Poker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Scrum Poker</h1>
            <p>Estimate story points with your agile team</p>
        </header>

        <main>
            <div class="story-section">
                <h2>Current Story</h2>
                <textarea id="story-description" placeholder="Enter the user story description..."></textarea>
            </div>

            <div class="cards-section">
                <h2>Select Your Estimate</h2>
                <div class="poker-cards">
                    <div class="card" data-value="0">0</div>
                    <div class="card" data-value="0.5">½</div>
                    <div class="card" data-value="1">1</div>
                    <div class="card" data-value="2">2</div>
                    <div class="card" data-value="3">3</div>
                    <div class="card" data-value="5">5</div>
                    <div class="card" data-value="8">8</div>
                    <div class="card" data-value="13">13</div>
                    <div class="card" data-value="21">21</div>
                    <div class="card" data-value="?">?</div>
                    <div class="card" data-value="coffee">☕</div>
                </div>
            </div>

            <div class="team-section">
                <h2>Team Estimates</h2>
                <div class="team-members">
                    <div class="member">
                        <span class="member-name">You</span>
                        <span class="member-estimate" id="your-estimate">-</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="reveal-btn" disabled>Reveal Cards</button>
                <button id="reset-btn">Reset Round</button>
                <button id="add-member-btn">Add Team Member</button>
            </div>

            <div class="results" id="results" style="display: none;">
                <h2>Results</h2>
                <div class="stats">
                    <div class="stat">
                        <label>Average:</label>
                        <span id="average">-</span>
                    </div>
                    <div class="stat">
                        <label>Most Common:</label>
                        <span id="most-common">-</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
